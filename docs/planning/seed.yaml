# Family Health OS (FHOS) — MVP Seed Specification
# Generated: 2026-04-19 | Interview: interview_20260416_052016 (Q1~Q58)

goal: >
  가족을 하나의 건강 운영 단위로 연결하여 AI 기반 공동 챌린지를 수행하고
  룰 기반 리스크 점수로 가족 건강을 시각화하는 예방 헬스케어 MVP를 출시한다.
  핵심 검증 목표: "가족 단위 행동 변화 가능성 확인" (완전 무료, PMF 검증 도구)

constraints:
  # 플랫폼 / 기술 스택
  - 모바일: React Native (iOS + Android 동시 지원)
  - 백엔드: Kotlin + Spring Boot
  - 데이터베이스: PostgreSQL
  - 인프라: AWS, 월 예산 50만원 이하
  - 웨어러블: Google Health Connect (Android) + Apple HealthKit (iOS)
  - LLM API: 챌린지 추천 전용 (리스크 점수 계산 제외)
  - LLM 가드레일: 허용 카테고리 사전 정의(A안) + 금지 목록(B안) 복합 적용

  # 규제 / 법률
  - 서비스는 "의료 진단"이 아닌 "건강 관리" 서비스로 포지셔닝 (면책 문구 필수)
  - PIPA(개인정보보호법) 준수 필수
  - 미성년자: 독립 소셜 로그인 허용 + 온보딩 시 부모 PIPA 동의 플로우 포함
  - 가족 구성원 간 데이터 공유는 동의 기반

  # MVP 범위 제외 항목
  - 보험 연계 기능 (Phase 3 이후)
  - AI 코칭 푸시 알림 (Phase 2 이후)
  - 병원 데이터 연동 (장기 목표)
  - B2B2C 수익 모델 (Phase 3)
  - ML 기반 리스크 예측 모델 (Phase 2)

  # 설계 원칙
  - 오픈 베타 중단 / 조기 종료 가능성 고려: 외부 서비스 없어도 핵심 기능 동작
  - MVP BM: 완전 무료 (수익 없음, 검증 도구로만 운용)

acceptance_criteria:
  - id: AC-01
    description: 가족 그룹 생성 및 구성원 초대가 완료된다
    verification: 최소 2명 이상 연결된 가족 그룹 생성 가능

  - id: AC-02
    description: 온보딩 설문 완료 후 가족 리스크 점수가 표시된다
    verification: >
      룰 기반 점수 (유전 30% + 생활습관 25% + 행동 20% + 환경 15% + 의료 10%)
      계산 후 홈화면에 리스크 점수가 먼저 렌더링됨

  - id: AC-03
    description: AI가 가족 맞춤 챌린지를 자동 추천한다
    verification: >
      입력: 리스크 점수 + 챌린지 달성 이력 + 선호도
      출력: 가드레일을 통과한 챌린지 1개 이상 제안

  - id: AC-04
    description: 챌린지 완료 체크인이 작동한다
    verification: >
      웨어러블 데이터 우선 판정;
      웨어러블 없는 구성원은 수동 입력 또는 사진 업로드(업로드 자체가 완료 조건)로 대체

  - id: AC-05
    description: 가족 공동 마감 시간과 리마인더 푸시가 작동한다
    verification: 마감 2시간 전 푸시 알림 발송 확인

  - id: AC-06
    description: 가족 스트리크와 랭킹이 표시된다
    verification: >
      스트리크: 가족 단위 연속 챌린지 성공 일수 카운트
      랭킹: 리스크 개선율 기준 정렬

  - id: AC-07
    description: 하드코딩 배지 시스템이 정상 동작한다
    verification: 조건 달성 시 배지 수여 확인

  - id: AC-08
    description: 미성년자 부모 PIPA 동의 플로우가 작동한다
    verification: 미성년자 가입 시 부모 동의 화면 노출 및 동의 저장 확인

  - id: AC-09
    description: 웨어러블 동기화 실패 시 이전 데이터를 유지 표시한다
    verification: Health Connect / HealthKit 권한 거부 상태에서도 이전 데이터 노출

  - id: AC-10
    description: 탈퇴 처리 및 데이터 정책이 준수된다
    verification: >
      가족 구성원 제외: 해당 구성원 데이터 즉시 삭제
      계정 탈퇴: 90일 후 자동 파기

ontology_schema:
  name: FamilyHealthOS
  description: 가족 단위 예방 헬스케어 도메인 모델

  entities:
    Family:
      fields:
        - name: id
          type: uuid
        - name: name
          type: string
        - name: risk_score
          type: float
          description: 가족 평균 종합 리스크 점수 (0~100)
        - name: streak_days
          type: integer
          description: 가족 연속 챌린지 성공 일수
        - name: members
          type: array[MemberRef]

    Member:
      fields:
        - name: id
          type: uuid
        - name: family_id
          type: uuid
        - name: relationship
          type: enum[self, parent, spouse, child]
        - name: is_minor
          type: boolean
        - name: pipa_consent_by
          type: uuid_nullable
          description: 미성년자인 경우 동의한 부모 ID
        - name: health_profile
          type: HealthProfile
        - name: risk_score
          type: RiskScore

    HealthProfile:
      fields:
        - name: height_cm
          type: float
        - name: weight_kg
          type: float
        - name: current_diseases
          type: array[string]
        - name: medications
          type: boolean
        - name: family_history
          type: array[enum[diabetes, hypertension, cardiovascular, obesity]]
        - name: lifestyle
          type: Lifestyle

    Lifestyle:
      fields:
        - name: meals_together_per_week
          type: integer
        - name: dining_out_frequency
          type: enum[rarely, sometimes, often]
        - name: sleep_start
          type: time
        - name: sleep_end
          type: time
        - name: activity_level
          type: enum[low, moderate, high]
        - name: smoking
          type: boolean
        - name: alcohol_frequency
          type: enum[none, occasional, regular]

    RiskScore:
      fields:
        - name: total
          type: float
          description: 0~100 최종 점수
        - name: genetic
          type: float
          description: 유전 요소 (30%)
        - name: lifestyle
          type: float
          description: 생활습관 (25%)
        - name: behavior
          type: float
          description: 챌린지 참여 행동 (20%)
        - name: environment
          type: float
          description: 수면 환경 (15%)
        - name: clinical
          type: float
          description: BMI/혈압/기존 질환 (10%)
        - name: updated_at
          type: timestamp
          description: 설문 재응답 또는 웨어러블 동기화 시 갱신

    Challenge:
      fields:
        - name: id
          type: uuid
        - name: family_id
          type: uuid
        - name: title
          type: string
        - name: category
          type: enum[walking, diet, sleep, exercise, hydration]
        - name: deadline
          type: datetime
          description: 가족 공동 마감 시간
        - name: completions
          type: array[ChallengeCompletion]
        - name: ai_generated
          type: boolean

    ChallengeCompletion:
      fields:
        - name: member_id
          type: uuid
        - name: completed
          type: boolean
        - name: source
          type: enum[wearable, manual_input, photo_upload]
          description: 웨어러블 우선, 없으면 수동/사진
        - name: completed_at
          type: timestamp

    Badge:
      fields:
        - name: id
          type: uuid
        - name: target_id
          type: uuid
          description: member_id 또는 family_id
        - name: target_type
          type: enum[member, family]
        - name: badge_type
          type: enum[first_challenge, streak_7, streak_30, risk_improved, family_complete]
        - name: earned_at
          type: timestamp

evaluation_principles:
  - name: 가족 연결 완성도
    weight: 0.25
    description: 온보딩 완료율, 가족 구성원 초대 성공율
  - name: 챌린지 수행 완성도
    weight: 0.25
    description: 챌린지 완료율, 체크인 정확도
  - name: 리스크 점수 정확도
    weight: 0.20
    description: 룰 기반 점수 계산 로직의 정확성 및 설명 가능성
  - name: AI 추천 관련성
    weight: 0.15
    description: 가드레일 준수율, 추천 챌린지 사용자 수락율
  - name: 핵심 UX 완성도
    weight: 0.15
    description: 온보딩 완료 시간 3분 이내, D1 리텐션 >= 50%

exit_conditions:
  - 가족 연결 + 챌린지 1개 완료로 MVP 핵심 플로우 검증 완료
  - 모든 AC (AC-01 ~ AC-10) 통과
  - 앱 크래시 없이 온보딩 ~ 첫 챌린지 완료 플로우 동작
  - 미성년자 PIPA 동의 플로우 정상 동작

non_goals:
  - 의료 진단 또는 처방 기능
  - 보험 연계 및 보험료 할인
  - ML 기반 질병 예측 모델
  - AI 코칭 푸시 알림
  - 병원 데이터 연동
  - B2B2C 수익화

